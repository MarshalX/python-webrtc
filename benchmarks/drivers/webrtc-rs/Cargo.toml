[package]
name = "webrtc-rs-driver"
version = "0.1.0"
edition = "2024"
publish = false
description = "The driver of webrtc-rs for the benchmarks, speaking benchmarks/protocol.py"
license = "BSD-3-Clause"

[dependencies]
# pinned exactly: build.rs passes the locked version to hello
webrtc = "=0.21.1"
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
