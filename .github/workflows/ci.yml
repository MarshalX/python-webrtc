name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * 5'  # Fridays, catches breakage from runner images, dependencies and downloads
      timezone: Europe/Warsaw

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check
      - run: uvx ruff format --check

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    needs: sdist
    name: wheels (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15, windows-latest]
        # PRs: oldest and newest only
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["cp39","cp314"]' || '["cp39","cp310","cp311","cp312","cp313","cp314"]') }}
    env:
      WRTC_CACHE_DIR: ${{ github.workspace }}/.wrtc-cache
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
      - name: Locate sdist
        shell: bash
        run: echo "SDIST=$(ls *.tar.gz)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        if: runner.os != 'Windows'
        with:
          path: .ci-src
          sparse-checkout: cmake
      # not on Windows: the unstripped lib restores slower than it unpacks
      - uses: actions/cache@v6
        if: runner.os != 'Windows'
        with:
          path: .wrtc-cache
          key: libwebrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.ci-src/cmake/libwebrtc.cmake', '.ci-src/cmake/libcxx/*.sha256') }}
      - uses: astral-sh/setup-uv@v7
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume=${{ github.workspace }}/.wrtc-cache:/tmp/wrtc-cache"
        with:
          package-dir: ${{ env.SDIST }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  sanitizers:
    name: sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/sanitizers.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, sdist, wheels, sanitizers]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2
