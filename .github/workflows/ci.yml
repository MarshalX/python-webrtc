name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * 5'  # Fridays, catches breakage from runner images, dependencies and downloads
      timezone: Europe/Warsaw

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      WRTC_CACHE_DIR: ${{ github.workspace }}/.wrtc-cache
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check
      - run: uvx ruff format --check
      # the imports of the checked code, without building the extension: its stub is in stubs/
      - run: uv sync --group dev --group wpt --no-install-project
      - run: uvx pyrefly check
      - run: make format-check
      # clang-tidy reads the libwebrtc headers, from the cache the wheels use
      - uses: actions/cache@v6
        with:
          path: .wrtc-cache
          key: libwebrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/libwebrtc.cmake', 'cmake/libcxx/*.sha256', 'cmake/openh264.*') }}
      - run: make tidy

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        id: upload
        continue-on-error: true
        with:
          name: sdist
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        if: steps.upload.outcome == 'failure'
        with:
          name: sdist
          path: dist/*.tar.gz
          overwrite: true

  wheels:
    name: wheels (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
        # PRs: oldest and newest only, with and without the GIL
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["cp39","cp315","cp315t"]' || '["cp39","cp310","cp311","cp312","cp313","cp314","cp314t","cp315","cp315t"]') }}
    env:
      WRTC_CACHE_DIR: ${{ github.workspace }}/.wrtc-cache
      WRTC_ARCHIVE_DIR: ${{ matrix.os == 'windows-latest' && format('{0}/.wrtc-cache/archives', github.workspace) || '' }}
      UV_HTTP_RETRIES: 10
      CIBW_ENVIRONMENT_PASS_LINUX: UV_HTTP_RETRIES
    steps:
      - uses: actions/checkout@v7
        with:
          path: .ci-src
      - uses: astral-sh/setup-uv@v7
      # not downloaded: the artifact service fails now and then
      - name: Build sdist
        shell: bash
        run: |
          uv build --sdist --out-dir sdist .ci-src
          echo "SDIST=$(ls sdist/*.tar.gz)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        if: runner.os != 'Windows'
        with:
          path: .wrtc-cache
          key: libwebrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.ci-src/cmake/libwebrtc.cmake', '.ci-src/cmake/libcxx/*.sha256', '.ci-src/cmake/openh264.*') }}
      # Windows: the unstripped lib restores slower than it unpacks
      - uses: actions/cache@v6
        if: runner.os == 'Windows'
        with:
          path: |
            .wrtc-cache/archives
            .wrtc-cache/openh264-*
          key: libwebrtc-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.ci-src/cmake/libwebrtc.cmake', '.ci-src/cmake/libcxx/*.sha256', '.ci-src/cmake/openh264.*') }}
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume=${{ github.workspace }}/.wrtc-cache:/tmp/wrtc-cache"
        with:
          package-dir: ${{ env.SDIST }}
      - uses: actions/upload-artifact@v7
        id: upload
        continue-on-error: true
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl
      - uses: actions/upload-artifact@v7
        if: steps.upload.outcome == 'failure'
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          overwrite: true

  sanitizers:
    name: sanitizers (ASan + UBSan, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          # also covers the libc++ built from source for arm64
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      # github.workspace is the host's path
      - run: echo "WRTC_CACHE_DIR=$GITHUB_WORKSPACE/.wrtc-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: .wrtc-cache
          key: libwebrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/libwebrtc.cmake', 'cmake/libcxx/*.sha256', 'cmake/openh264.*') }}
      - run: .github/scripts/sanitizers.sh
      # the collector running on libwebrtc threads, whenever they emit (see tests/conftest.py)
      - run: .github/scripts/sanitizers.sh --gc-on-emit
      # long random sequences of calls (tests/chaos.py)
      - run: .github/scripts/sanitizers.sh --stress -k "stress or chaos"

  sanitizers-macos:
    name: sanitizers (ASan + UBSan, macOS)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      WRTC_CACHE_DIR: ${{ github.workspace }}/.wrtc-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .wrtc-cache
          key: libwebrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/libwebrtc.cmake', 'cmake/libcxx/*.sha256', 'cmake/openh264.*') }}
      - uses: astral-sh/setup-uv@v7
      - run: .github/scripts/sanitizers-macos.sh
      - run: .github/scripts/sanitizers-macos.sh --gc-on-emit

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, sdist, wheels, sanitizers, sanitizers-macos]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true
