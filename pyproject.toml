[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "wrtc"  # "webrtc" isn't allowed on PyPI
version = "0.0.1"
description = "a Python extension that provides bindings to WebRTC M152"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Ilya (Marshal)", email = "ilya@marshal.dev" }]
requires-python = ">=3.9"
dependencies = ["typing_extensions>=4.10"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Communications",
    "Topic :: Communications :: Internet Phone",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MarshalX/python-webrtc"
Documentation = "https://wrtc.marshal.dev/"
Source = "https://github.com/MarshalX/python-webrtc"
Tracker = "https://github.com/MarshalX/python-webrtc/issues"
Author = "https://github.com/MarshalX"

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3"]
dev = [
    { include-group = "test" },
    "scikit-build-core>=0.11",
    "pybind11>=3.0",
    "ruff>=0.16.9",
    "pybind11-stubgen>=2.5",
]
wpt = [
    "pytest-xdist>=3.8.0",
    "pythonmonkey>=1.3.2",
]
# sphinx 9 needs 3.12+
docs = [
    "typing_extensions>=4.10",
    "sphinx==9.1.0; python_version >= '3.12'",
    "sphinxawesome-theme==6.0.5; python_version >= '3.12'",
    "myst-parser==5.1.0; python_version >= '3.12'",
    "sphinx-design==0.7.0; python_version >= '3.12'",
    "sphinx-sitemap==2.9.0; python_version >= '3.12'",
    "sphinx-docsearch==0.3.1; python_version >= '3.12'",
    "sphinx-favicon==1.1.0; python_version >= '3.12'",
    "sphinxext-opengraph==0.13.0; python_version >= '3.12'",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python-webrtc/python/webrtc"]
sdist.exclude = [".github", ".idea", "docs", "examples", "wpt"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
build-frontend = "build[uv]"
# dev builds stay per file to catch missing includes
config-settings = { "cmake.define.CMAKE_UNITY_BUILD" = "ON" }
test-groups = ["test"]
# again with the garbage collector on libwebrtc threads (see DeleteOffLibwebrtcThread)
test-command = "pytest {project}/tests && pytest {project}/tests --gc-on-emit"

[tool.cibuildwheel.linux]
archs = ["native"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# libwebrtc for Linux is compiled against Chromium's libc++, which needs Clang; arm64 links compiler-rt
before-all = "dnf install -y clang lld compiler-rt"
environment = { CC = "clang", CXX = "clang++", WRTC_CACHE_DIR = "/tmp/wrtc-cache" }

[tool.cibuildwheel.macos]
archs = ["native"]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
timeout_method = "thread"
faulthandler_timeout = 60

[tool.ruff]
required-version = ">=0.16.9"
line-length = 120
target-version = "py39"
preview = true
include = [
    "python-webrtc/python/webrtc/**/*.py", "tests/**/*.py", "examples/**/*.py", "benchmarks/**/*.py", "cmake/**/*.py",
    "docs/**/*.py",
]
extend-exclude = ["*.pyi"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "Q",  # the formatter owns trailing commas and quotes
    "TRY003",  # a message per raise, not an exception class per message
    "D105", "D107",  # class docstrings document constructors, dunders explain themselves
    "DOC502",  # exceptions raised by native calls and helpers are documented too
    "PLC1901",  # pyrefly's implicit-bool wants explicit comparisons, like != ''
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001", "E402"]  # the import order resolves the cycles
# camelCase aliases of the W3C names; spec internal slots shared between the classes of the package
"python-webrtc/python/webrtc/**" = ["N815", "N816", "SLF001"]
"python-webrtc/python/webrtc/interfaces/rtc_peer_connection.py" = ["PLR0904"]  # the W3C interface
# user callbacks error the stream, as the specification says; handler errors go to the loop's exception handler
"python-webrtc/python/webrtc/{streams.py,utils/events.py}" = ["BLE001"]
# native leak counters and queues have no public API; chaos replays a seeded random
"tests/**" = ["S101", "D1", "PLR2004", "S404", "S603", "SLF001", "S311"]
"examples/**" = ["T201"]
"benchmarks/**" = ["T201", "S404", "S603"]
"cmake/**" = ["T201", "S404", "S603"]
"docs/**" = ["INP001", "T201"]
"docs/source/conf.py" = ["A001", "FBT001", "PLR0917"]  # the names and signatures Sphinx expects

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-builtins]
ignorelist = ["format", "hash", "id", "type"]  # W3C member names

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.flake8-annotations]
mypy-init-return = false

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 3
max-branches = 8
max-returns = 4
max-statements = 30
max-locals = 10
max-nested-blocks = 3
max-bool-expr = 3
max-public-methods = 20

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["webrtc", "wrtc", "tests", "benchmarks"]

[tool.pyrefly]
required-version = ">=1.3.2"
preset = "all"
project-includes = [
    "python-webrtc/python/webrtc/**/*.py", "tests/**/*.py", "examples/**/*.py", "benchmarks/**/*.py", "cmake/**/*.py",
    "stubs/**/*.pyi",
]
# tests/fuzz runs with its directory on PYTHONPATH (.github/scripts/fuzz.sh)
search-path = ["python-webrtc/python", "stubs", ".", "tests/fuzz"]
python-version = "3.9"
python-platform = "all"
python-interpreter-path = ".venv/bin/python"
strict-callable-subtyping = true
infer-with-first-use = false
permissive-ignores = false
type-ignore-unknown-tag-behavior = "no-effect"
# optional modules of the fuzzers and examples, not installed with the project
ignore-missing-imports = ["atheris", "httpx", "pytgcalls", "pytgcalls.*", "pyrogram", "pyrogram.*", "sounddevice"]

# like WebIDL, the library converts what callers pass (bool(), int(), str()), whatever the annotations say
[[tool.pyrefly.sub-config]]
matches = "python-webrtc/python/webrtc/**"
errors = { unnecessary-type-conversion = false }

# callers of browser-style APIs drop results, like the transceiver of add_track(); the library keeps the check
[[tool.pyrefly.sub-config]]
matches = "tests/**"
errors = { unused-call-result = false }
[[tool.pyrefly.sub-config]]
matches = "examples/**"
errors = { unused-call-result = false }
[[tool.pyrefly.sub-config]]
matches = "benchmarks/**"
errors = { unused-call-result = false }
[[tool.pyrefly.sub-config]]
matches = "cmake/**"
errors = { unused-call-result = false }
