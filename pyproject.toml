[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "wrtc"  # "webrtc" isn't allowed on PyPI
version = "0.0.0.dev10"
description = "a Python extension that provides bindings to WebRTC M152"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Ilya (Marshal)", email = "ilya@marshal.dev" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 1 - Planning",
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Communications",
    "Topic :: Communications :: Internet Phone",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MarshalX/python-webrtc"
Documentation = "https://wrtc.rtfd.io/"
Source = "https://github.com/MarshalX/python-webrtc"
Tracker = "https://github.com/MarshalX/python-webrtc/issues"
Author = "https://github.com/MarshalX"

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3"]
dev = [
    { include-group = "test" },
    "scikit-build-core>=0.11",
    "pybind11>=3.0",
    "ruff>=0.16.9",
    "pybind11-stubgen>=2.5",
]
wpt = [
    "pytest-xdist>=3.8.0",
    "pythonmonkey>=1.3.2",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python-webrtc/python/webrtc"]
sdist.exclude = [
    ".github", ".idea", "docs", "docs_html", "examples", "node-webrtc", "wpt",
    "Dockerfile*", "docker-compose.yaml", "/py.typed",
    "python-webrtc/python/*.py", "python-webrtc/python/*.session*", "python-webrtc/python/*.raw",
]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
build-frontend = "build[uv]"
# dev builds stay per file to catch missing includes
config-settings = { "cmake.define.CMAKE_UNITY_BUILD" = "ON" }
test-groups = ["test"]
# again with the garbage collector on libwebrtc threads (see DeleteOffLibwebrtcThread)
test-command = "pytest {project}/tests && pytest {project}/tests --gc-on-emit"

[tool.cibuildwheel.linux]
archs = ["native"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# libwebrtc for Linux is compiled against Chromium's libc++, which needs Clang; arm64 links compiler-rt
before-all = "dnf install -y clang lld compiler-rt"
environment = { CC = "clang", CXX = "clang++", WRTC_CACHE_DIR = "/tmp/wrtc-cache" }

[tool.cibuildwheel.macos]
archs = ["native"]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
timeout_method = "thread"
faulthandler_timeout = 60

[tool.ruff]
required-version = ">=0.16.9"
line-length = 120
target-version = "py39"
preview = true
include = [
    "python-webrtc/python/webrtc/**/*.py", "tests/**/*.py", "examples/**/*.py", "benchmarks/**/*.py", "cmake/**/*.py",
]
extend-exclude = ["*.pyi"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "Q",  # the formatter owns trailing commas and quotes
    "TRY003",  # a message per raise, not an exception class per message
    "D105", "D107",  # class docstrings document constructors, dunders explain themselves
    "DOC502",  # exceptions raised by native calls and helpers are documented too
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001", "E402"]  # the import order resolves the cycles
# camelCase aliases of the W3C names; spec internal slots shared between the classes of the package
"python-webrtc/python/webrtc/**" = ["N815", "N816", "SLF001"]
"python-webrtc/python/webrtc/interfaces/rtc_peer_connection.py" = ["PLR0904"]  # the W3C interface
# user callbacks error the stream, as the specification says; handler errors go to the loop's exception handler
"python-webrtc/python/webrtc/{streams.py,utils/events.py}" = ["BLE001"]
"python-webrtc/python/webrtc/models/rtc_stats.py" = ["FURB189"]  # a real dict, for json and isinstance
# native leak counters and queues have no public API; chaos replays a seeded random
"tests/**" = ["S101", "D1", "PLR2004", "S404", "S603", "SLF001", "S311"]
"examples/**" = ["T201"]
"benchmarks/**" = ["T201", "S404", "S603"]
"cmake/**" = ["T201", "S404", "S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-builtins]
ignorelist = ["format", "id", "type"]  # W3C member names

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.flake8-annotations]
mypy-init-return = false

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 3
max-branches = 8
max-returns = 4
max-statements = 30
max-locals = 10
max-nested-blocks = 3
max-bool-expr = 3
max-public-methods = 20

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["webrtc", "wrtc", "tests", "benchmarks"]
